<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#060C06"/>

  <!-- Outer glow -->
  <ellipse cx="256" cy="265" rx="160" ry="185" fill="rgba(200,151,42,0.07)"/>

  <!-- Feather body -->

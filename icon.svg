     stroke="#E8B84B" stroke-width="4.5"
     stroke-linecap="round" opacity="0.9"/>

  <!-- Left barbs -->
  <line x1="253" y1="150" x2="198" y2="188" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="252" y1="188" x2="186" y2="232" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="251" y1="226" x2="178" y2="276" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="251" y1="264" x2="177" y2="318" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="252" y1="302" x2="183" y2="356" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="253" y1="338" x2="196" y2="388" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="254" y1="370" x2="213" y2="413" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Right barbs -->
  <line x1="259" y1="150" x2="314" y2="188" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="260" y1="188" x2="326" y2="232" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="261" y1="226" x2="334" y2="276" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="261" y1="264" x2="335" y2="318" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="260" y1="302" x2="329" y2="356" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="259" y1="338" x2="316" y2="388" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="258" y1="370" x2="299" y2="413" stroke="#7A5515" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

